name: Build Hellfire Gas

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract source ZIP
        run: |
          unzip -o src.zip -d .
          test -f src/main/java/com/hellfiregas/HellfireGas.java
          test -f src/main/resources/fabric.mod.json
          test -f src/main/resources/assets/hellfiregas/textures/item/hellfire_fruit.png

      - name: Build
        run: gradle build --no-daemon

      - name: Check JAR contents
        run: |
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$JAR"
          echo "Checking: $JAR"
          jar tf "$JAR"

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: HellfireGas-JAR
          path: build/libs/*.jar
