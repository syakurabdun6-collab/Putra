
name: Build Hellfire Gas

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Source
        run: |
          unzip -o src.zip -d .
          ls HellfireGas/

      - name: Build Mod
        run: gradle -p HellfireGas build --no-daemon

      - name: Check Mod JAR
        run: |
          JAR=$(find HellfireGas/build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$JAR"
          unzip -l "$JAR"
          unzip -l "$JAR" | grep -q fabric.mod.json

      - name: Upload Mod
        uses: actions/upload-artifact@v4
        with:
          name: HellfireGas-JAR
          path: HellfireGas/build/libs/*.jar
          if-no-files-found: error
