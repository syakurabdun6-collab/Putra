
name: Build Hellfire Gas

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find project
        run: |
          if [ -f "build.gradle" ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          elif [ -f "HellfireGas/build.gradle" ]; then
            echo "PROJECT_DIR=HellfireGas" >> $GITHUB_ENV
          else
            echo "ERROR: build.gradle not found"
            exit 1
          fi

      - name: Build mod
        run: gradle -p "$PROJECT_DIR" build --no-daemon

      - name: Check JAR
        run: |
          find "$PROJECT_DIR/build/libs" -maxdepth 1 -name '*.jar' -print
          find "$PROJECT_DIR/build/libs" -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -exec sh -c '
            echo "Checking: $1"
            unzip -l "$1"
          ' _ {} \;

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: HellfireGas-JAR
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*[!.sources].jar
          if-no-files-found: error
